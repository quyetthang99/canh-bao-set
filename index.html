    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .info-panel {
            position: absolute; top: 15px; right: 50px;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000; width: 260px;
        }
        .info-panel h3 { margin-top: 0; margin-bottom: 4px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .author-credit { font-size: 12px; color: #666; font-style: italic; margin-top: 5px; margin-bottom: 10px; text-align: right; }
        .status { font-weight: bold; }
        .popup-custom { max-height: 200px; overflow-y: auto; font-size: 13px; }
        .popup-custom b { color: #0056b3; }
        .filter-section { margin-top: 10px; padding-top: 5px; }
        select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #aaa; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        
        .lightning-icon-div { cursor: pointer; filter: drop-shadow(0 0 2px rgba(0,0,0,0.8)); transition: transform 0.2s; }
        .lightning-icon-div:hover { transform: scale(1.4); }
        
        .btn-excel {
            background-color: #28a745; color: white; border: none; padding: 6px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px;
            margin-top: 5px; transition: 0.2s;
        }
        .btn-excel:hover { background-color: #218838; }

        .island-label {
            font-weight: bold; color: #bd0000; background: rgba(255, 255, 255, 0.9);
            border: 1px solid #bd0000; border-radius: 4px; font-size: 12px;
            padding: 4px 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);

    </style>
</head>

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
        const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google Giao thông' });
        const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google Vệ tinh' });

        const map = L.map('map', {
            center: [22.0000, 104.5000],
            zoom: 8,
            layers: [osmLayer] 
        });

        const lightningLayer = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                const count = cluster.getChildCount();
                let bgColor = 'rgba(255, 193, 7, 0.85)'; 
                let borderColor = '#FFC107';
                let textColor = '#000';
                let size = 35;

                if (count >= 50) {
                    bgColor = 'rgba(253, 126, 20, 0.85)'; 
                    borderColor = '#FD7E14';
                    textColor = '#fff';
                    size = 45;
                }

                return L.divIcon({
                    html: `<div style="background-color: ${bgColor}; border: 2px solid ${borderColor}; color: ${textColor}; width: ${size}px; height: ${size}px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; box-shadow: 0 3px 8px rgba(0,0,0,0.3);">${count}</div>`,
                    className: 'custom-cluster-icon',
                    iconSize: L.point(size, size)
                });
            },
            animate: false, 
            chunkedLoading: true 
        }).addTo(map);

        const dienLucList = {
            " ĐL Văn Bàn": "vanban.json", 
            " ĐL Lào Cai": "laocai.json",
            " ĐL SaPa": "sapa.json",
            " ĐL Bát Xát": "batxat.json",
            " ĐL Bắc Hà": "bacha.json",
            " ĐL Bảo Thắng": "baothang.json",
            " ĐL Bảo Yên": "baoyen.json",
            " ĐL Mường Khương": "muongkhuong.json",
            " ĐL Yên Bái": "yenbai.json",
            " ĐL Trấn Yên": "tranyen.json",
            " ĐL Văn Yên": "vanyen.json",
            " ĐL Lục Yên": "lucyen.json",
            " ĐL Nghĩa Lộ": "nghialo.json",
            " Cao Thế LC": "caothelc.json",
            " Cao Thế YB": "caotheyb.json"
        };

        const gridLayers = {};
        const overlayMaps = {
            "⚡ Cảnh báo Sét đánh": lightningLayer
        };

        for (let key in dienLucList) {
            gridLayers[key] = L.layerGroup(); 
            overlayMaps[key] = gridLayers[key];
        }

        const baseMaps = {
            "🗺️ Bản đồ Tiêu chuẩn": osmLayer,
            "🚗 Bản đồ Giao thông": googleStreets,
            "🛰️ Bản đồ Vệ tinh": googleSat
        };

        L.control.layers(baseMaps, overlayMaps, {collapsed: false, position: 'bottomleft'}).addTo(map);

        map.on('overlayadd overlayremove', function() {
            filterLightning();
        });

        const redStarIcon = L.divIcon({
            html: '<svg width="28" height="28" viewBox="0 0 24 24"><path fill="#ff1a1a" stroke="#ffffff" stroke-width="1.2" d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z"></path></svg>',
            className: 'lightning-icon-div', iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
        });

        const islandIcon = L.divIcon({
            html: '<svg width="14" height="14" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="#ff1a1a" stroke="#ffffff" stroke-width="1.2"></circle></svg>',
            className: 'lightning-icon-div', iconSize: [14, 14], iconAnchor: [7, 7]
        });

        const hanoiMarker = L.marker([21.0285, 105.8542], { icon: redStarIcon }).addTo(map);
        hanoiMarker.bindPopup("<div style='text-align:center; font-weight:bold; font-size:13px;'>THỦ ĐÔ HÀ NỘI</div>");

        const hoangSaMarker = L.marker([16.5000, 112.0000], { icon: islandIcon }).addTo(map);
        hoangSaMarker.bindTooltip("QUẦN ĐẢO HOÀNG SA<br>(VIỆT NAM)", { permanent: true, direction: 'right', className: 'island-label', offset: [10, 0] });
        
        const truongSaMarker = L.marker([9.5000, 112.5000], { icon: islandIcon }).addTo(map);
        truongSaMarker.bindTooltip("QUẦN ĐẢO TRƯỜNG SA<br>(VIỆT NAM)", { permanent: true, direction: 'right', className: 'island-label', offset: [10, 0] });

        let poleFeaturesByLayer = {}; 
        let currentExportData = [];

        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        const drawControl = new L.Control.Draw({
            position: 'topleft',
            edit: { featureGroup: drawnItems, edit: false, remove: true },
            draw: {
                polyline: false, marker: false, circlemarker: false, circle: false,
                polygon: { allowIntersection: false, showArea: true }, rectangle: true
            }
        });
        map.addControl(drawControl);

        let activePolygonGeoJSON = null; 
        let activePolygonLayer = null;

        map.on(L.Draw.Event.CREATED, function (e) {
            drawnItems.clearLayers(); 
            const layer = e.layer;
            drawnItems.addLayer(layer);
            activePolygonGeoJSON = layer.toGeoJSON();
            activePolygonLayer = layer;
            filterLightning(); 
        });

        map.on(L.Draw.Event.DELETED, function (e) {
            if (drawnItems.getLayers().length === 0) {
                activePolygonGeoJSON = null;
                activePolygonLayer = null;
            }
            filterLightning();
        });

        const lightningIconRed = L.divIcon({
            html: '<svg width="24" height="24" viewBox="0 0 24 24"><path fill="#ff1a1a" stroke="#ffffff" stroke-width="1" d="M12,2L2,14h8v8l12-12h-8L12,2z"></path></svg>',
            className: 'lightning-icon-div', iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12]
        });

        const lightningIconCloud = L.divIcon({
            html: '<svg width="28" height="28" viewBox="0 0 24 24"><path fill="#546E7A" stroke="#ffffff" stroke-width="0.5" d="M17.5,19A4.5,4.5 0 0,0 22,14.5C22,12.18 20.24,10.28 18,10.05C17.44,6.64 14.48,4 11,4C7.71,4 4.86,6.19 3.65,9.17C1.59,9.61 0,11.45 0,13.66C0,16.05 1.95,18 4.34,18H5V16H4.34C3.05,16 2,14.95 2,13.66C2,12.44 2.92,11.41 4.12,11.27L5.05,11.16L5.35,10.29C6.26,7.63 8.78,5.8 11.66,5.8C14.86,5.8 17.52,8.35 17.65,11.5L17.7,12.2L18.4,12.23C20.17,12.33 21.6,13.82 21.6,15.6C21.6,17.42 20.12,18.9 18.3,18.9H17V20.9H17.5Z"></path><path fill="#FFC107" stroke="#ffffff" stroke-width="1" d="M13,22l-3-8h2.5L11.5,5h3.5l3,8h-2.5L17,22L13,22z"></path></svg>',
            className: 'lightning-icon-div', iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
        });

        function detectPoleName(properties) {
            if (!properties) return "Không rõ tên";
            let tenDoiTuong = "";
            let soHieu = "";
            const tenKeys = ['tenDoiTuon', 'TenDoiTuong', 'tenDoiTuong', 'TEN_DOI_TUONG'];
            for (let key of tenKeys) {
                if (properties[key] !== null && properties[key] !== undefined && properties[key] !== "") {
                    tenDoiTuong = properties[key]; break;
                }
            }
            const soHieuKeys = ['soHieu', 'SoHieu', 'SO_HIEU'];
            for (let key of soHieuKeys) {
                if (properties[key] !== null && properties[key] !== undefined && properties[key] !== "") {
                    soHieu = properties[key]; break;
                }
            }
            if (tenDoiTuong && soHieu) return `${tenDoiTuong} (Số hiệu: ${soHieu})`;
            else if (tenDoiTuong) return tenDoiTuong; 
            else if (soHieu) return `Số hiệu: ${soHieu}`; 
            return "Cột chưa đặt tên";
        }

        async function loadGeoData() {
            for (let key in dienLucList) {
                poleFeaturesByLayer[key] = []; 
                let fileName = dienLucList[key];
                try {
                    const response = await fetch(`./${fileName}?t=${new Date().getTime()}`);
                    if (response.ok) {
                        const data = await response.json();
                        let poles = data.features.filter(f => f.geometry && (f.geometry.type === "Point" || f.geometry.type === "MultiPoint"));
                        poleFeaturesByLayer[key].push(...poles);

                        L.geoJSON(data, {
                            style: function (feature) {
                                if (feature.geometry.type === "LineString" || feature.geometry.type === "MultiLineString") {
                                    return { color: "#0056b3", weight: 3, opacity: 0.8 }; 
                                } return {};
                            },
                            pointToLayer: function (feature, latlng) {
                                return L.circleMarker(latlng, { radius: 5, fillColor: "#ff8c00", color: "#ffffff", weight: 1, fillOpacity: 0.9 });
                            },
                            onEachFeature: function (feature, layer) {
                                if (feature.properties) {
                                    let popupContent = "<div class='popup-custom'><b>Thông Tin Thiết Bị</b><hr style='margin:5px 0'>";
                                    for (const propKey in feature.properties) {
                                        if(feature.properties[propKey] !== null) popupContent += `<b>${propKey}:</b> ${feature.properties[propKey]}<br>`;
                                    }
                                    popupContent += "</div>";
                                    layer.bindPopup(popupContent);
                                }
                            }
                        }).addTo(gridLayers[key]);
                    }
                } catch (error) {}
            }
        }

        let lightningArray = []; 

        async function fetchLightningData() {
            const statusLabel = document.getElementById('loading-status');
            try {
                const response = await fetch('https://database-set-7a73d-default-rtdb.asia-southeast1.firebasedatabase.app/lightning_data.json');
                if (!response.ok) throw new Error("Lỗi kết nối Firebase");
                
                const lightningDatabase = await response.json();
                if (lightningDatabase) {
                    lightningArray = Object.values(lightningDatabase).sort((a, b) => b.timestamp - a.timestamp);
                    filterLightning(true);
                }
                statusLabel.innerText = "Hoạt động tốt (Firebase)";
                statusLabel.style.color = "green";
            } catch (error) {
                console.log(error);
                statusLabel.innerText = "Mất kết nối máy chủ sét...";
                statusLabel.style.color = "red";
            }
        }

        function exportExcel() {
            if (!currentExportData || currentExportData.length === 0) {
                alert("Không có dữ liệu điểm sét nào trong vùng để xuất báo cáo!");
                return;
            }
            let csvContent = "\uFEFFSTT,Vĩ Độ,Kinh Độ,Thời Gian Ghi Nhận,Cường Độ,Loại Sét,Cột Gần Nhất,Khoảng Cách\n";
            currentExportData.forEach((row) => {
                let safeTime = `"${row.time}"`;
                let safePole = `"${row.poleName}"`;
                let safeDist = `"${row.distSetToCot}"`;
                csvContent += `${row.stt},${row.lat},${row.lng},${safeTime},${row.giatri},${row.loaiset},${safePole},${safeDist}\n`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "Bao_Cao_Set.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function filterLightning(autoZoom = false) {
            lightningLayer.clearLayers();
            
            const filterSeconds = parseInt(document.getElementById('time-filter').value);
            const selectedProvince = document.getElementById('province-filter').value;
            const currentSeconds = Date.now() / 1000;
            const threshold = currentSeconds - filterSeconds;

            if (autoZoom) {
                if (selectedProvince === "all") {
                    map.setView([16.5, 105.0], 6); 
                } else if (provinceBounds[selectedProvince]) {
                    const b = provinceBounds[selectedProvince];
                    map.fitBounds([
                        [b.minLat, b.minLng],
                        [b.maxLat, b.maxLng]
                    ]);
                }
            }

            let count = 0;
            let cgCount = 0; // Đếm sét mặt đất
            let icCount = 0; // Đếm sét trong mây
            let insidePolygonData = []; 

            let activePoleFeatures = [];
            for (let key in gridLayers) {
                if (map.hasLayer(gridLayers[key]) && poleFeaturesByLayer[key]) {
                    activePoleFeatures = activePoleFeatures.concat(poleFeaturesByLayer[key]);
                }
            }

            for (let i = 0; i < lightningArray.length; i++) {
                const record = lightningArray[i];
                const timestamp = record.timestamp;

                if (timestamp < threshold) break; 

                let parsedStrikes = [];

                if (record.is_new_format) {
                    let typeText = record.loaiset === 0 ? "Xuống đất" : "Trong mây";
                    let giatriText = (record.giatri === 0 || record.giatri === 0.0) ? "Không có DL" : `${record.giatri} kA`;
                    parsedStrikes.push({
                        lat: record.lat, lng: record.lng, giatri: giatriText, loaiset: typeText
                    });
                } else if (record.info) {
                    for(let j = 0; j < record.info.length; j++) {
                        const strikeStr = record.info[j];
                        if(!strikeStr) continue;
                        const parts = strikeStr.split(',');
                        if(parts.length < 2) continue;
                        const coordsStr = parts.pop().trim();
                        const coordParts = coordsStr.split('-');
                        if(coordParts.length !== 2) continue;
                        parsedStrikes.push({
                            lat: parseFloat(coordParts[0]), lng: parseFloat(coordParts[1]), giatri: "Không có DL", loaiset: "Không rõ"
                        });
                    }
                }

                for (let strike of parsedStrikes) {
                    if (isNaN(strike.lat) || isNaN(strike.lng)) continue;

                    if (selectedProvince !== "all" && provinceBounds[selectedProvince]) {
                        const b = provinceBounds[selectedProvince];
                        if (strike.lat < b.minLat || strike.lat > b.maxLat || strike.lng < b.minLng || strike.lng > b.maxLng) {
                            continue;
                        }
                    }

                    const pt = turf.point([strike.lng, strike.lat]);
                    let isInside = true;

                    if (activePolygonGeoJSON) {
                        if (!turf.booleanPointInPolygon(pt, activePolygonGeoJSON)) {
                            isInside = false; 
                        }
                    }

                    if (!isInside) continue; 

                    const dateObj = new Date(timestamp * 1000);
                    const timeString = dateObj.toLocaleTimeString('vi-VN') + " - " + dateObj.toLocaleDateString('vi-VN');

                    let nearestPoleName = "Chưa bật lưới điện";
                    let distSetToCot = "N/A";

                    if (activePoleFeatures.length > 0) {
                        const poleCollection = turf.featureCollection(activePoleFeatures);
                        const nearestPoleFeature = turf.nearestPoint(pt, poleCollection);
                        nearestPoleName = detectPoleName(nearestPoleFeature.properties);
                        const dS2C = turf.distance(pt, nearestPoleFeature, {units: 'meters'});
                        distSetToCot = `${dS2C.toFixed(1)} m`;
                    }

                    insidePolygonData.push({
                        stt: count + 1,
                        lat: strike.lat.toFixed(4),
                        lng: strike.lng.toFixed(4),
                        giatri: strike.giatri,
                        loaiset: strike.loaiset,
                        time: timeString, 
                        poleName: nearestPoleName,
                        distSetToCot: distSetToCot
                    });

                    let currentIcon = lightningIconRed; 
                    if (strike.loaiset === "Trong mây") {
                        currentIcon = lightningIconCloud; 
                        icCount++; // Tăng biến đếm sét mây
                    } else {
                        cgCount++; // Sét mặt đất hoặc không rõ sẽ tính là mặt đất
                    }

                    let colorCode = strike.loaiset.includes("đất") ? "red" : "#ff8c00";

                    const popupHTML = `
                        <div style="font-family: Arial; font-size: 13px; width: 230px; line-height: 1.5;">
                            <b style="color:${colorCode}; font-size:14px;">⚡ THÔNG TIN SÉT</b><hr style="margin:5px 0;">
                            <b>Tọa độ:</b> ${strike.lat.toFixed(4)}, ${strike.lng.toFixed(4)}<br>
                            <b>Thời gian:</b> <span style="color:blue; font-weight:bold;">${timeString}</span><br>
                            <b>Cường độ:</b> <span style="color:#d32f2f; font-weight:bold;">${strike.giatri}</span><br>
                            <b>Loại sét:</b> ${strike.loaiset}<br>
                            <span style="color:#e65100;"><b>Cột gần nhất:</b> ${nearestPoleName} (${distSetToCot})</span>
                        </div>
                    `;

                    const marker = L.marker([strike.lat, strike.lng], { icon: currentIcon })
                                    .bindPopup(popupHTML)
                                    .bindTooltip(popupHTML, { direction: 'top', offset: [0, -15], opacity: 0.95 });
                    
                    lightningLayer.addLayer(marker);
                    count++;
                }
            }
            
            // CẬP NHẬT CÁC BỘ ĐẾM TRÊN GIAO DIỆN
            document.getElementById('lightning-count').innerText = count;
            document.getElementById('cg-count').innerText = cgCount;
            document.getElementById('ic-count').innerText = icCount;
            
            currentExportData = insidePolygonData;

            if (activePolygonLayer) {
                let tableRowsHtml = "";
                insidePolygonData.forEach((item) => {
                    let intensityColor = (item.giatri === "Không có DL") ? "#777" : "#d32f2f";
                    tableRowsHtml += `
                        <tr style="border-bottom: 1px solid #e0e0e0;">
                            <td style="padding: 6px; text-align: center;">${item.stt}</td>
                            <td style="padding: 6px; text-align: center; font-size: 11px;">${item.lat},<br>${item.lng}</td>
                            <td style="padding: 6px; text-align: center; font-weight:bold; color:${intensityColor};">${item.giatri}</td>
                            <td style="padding: 6px; text-align: center; color: ${item.loaiset.includes('Không') ? '#777' : '#0056b3'};">${item.loaiset}</td>
                            <td style="padding: 6px; text-align: center; color: #555; white-space: nowrap;">${item.time}</td>
                            <td style="padding: 6px; font-weight: bold; color: #0056b3; text-align: center; max-width: 150px; white-space: normal; word-wrap: break-word; line-height: 1.4;">${item.poleName}</td>
                            <td style="padding: 6px; color: #d32f2f; font-weight: bold; text-align: center; white-space: nowrap;">${item.distSetToCot}</td>
                        </tr>
                    `;
                });

                if (insidePolygonData.length === 0) {
                    tableRowsHtml = `<tr><td colspan="7" style="text-align:center; padding:15px; color:#777;">Không tìm thấy điểm sét nào.</td></tr>`;
                }

                const reportContent = `
                    <div style="font-family: Arial; font-size: 12px; width: 700px;"> 
                        <h4 style="margin: 0 0 6px 0; color: #d9534f; text-align: center; border-bottom: 2px solid #d9534f; padding-bottom: 4px;">KẾT QUẢ KHOANH VÙNG</h4>
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <p style="margin: 0;">Tổng số sét trong vùng: <b style="font-size:14px; color:red;">${insidePolygonData.length}</b></p>
                            <button class="btn-excel" onclick="exportExcel()">⬇ Xuất file Excel</button>
                        </div>

                        <div style="max-height: 220px; overflow-y: auto; border: 1px solid #ccc; border-radius: 4px;">
                            <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                                <thead style="background: #f5f5f5; position: sticky; top: 0; box-shadow: 0 1px 0 #ccc; z-index: 10;">
                                    <tr>
                                        <th style="padding: 6px; border-bottom: 1px solid #ccc;">STT</th>
                                        <th style="padding: 6px; border-bottom: 1px solid #ccc;">Vị trí (Tọa độ)</th>
                                        <th style="padding: 6px; border-bottom: 1px solid #ccc;">Cường độ</th>
                                        <th style="padding: 6px; border-bottom: 1px solid #ccc;">Loại sét</th>
                                        <th style="padding: 6px; border-bottom: 1px solid #ccc;">Thời gian</th>
                                        <th style="padding: 6px; border-bottom: 1px solid #ccc;">Cột gần nhất</th>
                                        <th style="padding: 6px; border-bottom: 1px solid #ccc;">Sét → Cột</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${tableRowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                activePolygonLayer.bindPopup(reportContent, { maxWidth: 750 }).openPopup();
            }
        }

        loadGeoData(); 
        fetchLightningData(); 
        setInterval(fetchLightningData, 180000); 
    </script>
</body>
</html>
