<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Cảnh Báo Sét & Lưới Điện - Design by Quyết Thắng</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* BẢNG CẢNH BÁO SÉT */
        .info-panel {
            position: absolute; top: 15px; right: 50px;
            background: rgba(255, 255, 255, 0.95); padding: 15px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000; width: 260px; transition: all 0.3s ease;
        }
        .panel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 5px; }
        .panel-header h3 { margin: 0; color: #333; font-size: 16px; }
        .panel-header:hover { color: #0056b3; }
        .info-panel.collapsed #panel-content { display: none; }
        .info-panel.collapsed { padding-bottom: 10px; width: 220px; }

        .author-credit { font-size: 12px; color: #666; font-style: italic; margin-top: 5px; margin-bottom: 10px; text-align: right; }
        .status { font-weight: bold; }
        .popup-custom { max-height: 200px; overflow-y: auto; font-size: 13px; }
        .popup-custom b { color: #0056b3; }
        .filter-section { margin-top: 10px; padding-top: 5px; }
        select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #aaa; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        
        /* THIẾT KẾ CÁC NÚT & LỚP */
        .btn-excel { background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; margin-top: 5px; transition: 0.2s; }
        .btn-excel:hover { background-color: #218838; }
        .island-label { font-weight: bold; color: #bd0000; background: rgba(255, 255, 255, 0.9); border: 1px solid #bd0000; border-radius: 4px; font-size: 12px; padding: 4px 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .lightning-icon-div { cursor: pointer; filter: drop-shadow(0 0 2px rgba(0,0,0,0.8)); transition: transform 0.2s; }
        .lightning-icon-div:hover { transform: scale(1.4); }

        /* CHECKBOX LỌC SÉT */
        .checkbox-group { background: #fff3e0; padding: 8px; border-radius: 6px; border: 1px solid #ffe0b2; margin-bottom: 10px; font-size: 13px; }
        .checkbox-group label { display: block; margin-bottom: 4px; cursor: pointer; font-weight: bold; }
        .checkbox-group input { margin-right: 6px; accent-color: #ff5722; cursor: pointer; }

        /* THANH TÌM KIẾM THIẾT BỊ */
        .search-box { background: #f1f8ff; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid #cce5ff; }
        #search-input { width: calc(100% - 16px); padding: 8px; border: 1px solid #99c2ff; border-radius: 4px; margin-top: 5px; font-size: 12px; font-weight: bold; }
        #search-results { max-height: 140px; overflow-y: auto; margin-top: 5px; }
        .search-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; border-bottom: 1px dashed #b8daff; font-size: 11px; background: white; margin-bottom: 3px; border-radius: 3px; }
        .search-item span { max-width: 130px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; color: #333; }
        .search-item button { background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; padding: 4px 8px; font-size: 10px; font-weight: bold; }
        .search-item button:hover { background: #0056b3; }

        /* NÚT THU GỌN LỚP BẢN ĐỒ DƯỚI GÓC TRÁI */
        .custom-collapsed .leaflet-control-layers-list { display: none !important; }
        .custom-collapsed { padding: 0 !important; border: none !important; background: transparent !important; box-shadow: none !important; }
        .layer-collapse-btn { padding: 8px 12px; background: #fff; border-radius: 4px; font-weight: bold; cursor: pointer; color: #0056b3; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .leaflet-control-layers:not(.custom-collapsed) .layer-collapse-btn { border-bottom: 1px solid #ccc; border-bottom-left-radius: 0; border-bottom-right-radius: 0; background: #f8f9fa; box-shadow: none; }
        .layer-collapse-btn:hover { background: #e9ecef; }
    </style>
</head>
<body>

    <div class="info-panel" id="main-info-panel">
        <div class="panel-header" onclick="toggleInfoPanel()">
            <h3>Cảnh Báo Giông Sét</h3>
            <span id="panel-toggle-icon" style="font-size: 12px; color: #0056b3;">▼</span>
        </div>
        
        <div id="panel-content">
            <div class="author-credit">Design by Quyết Thắng</div>
            
            <p style="margin-top: 0;">Trạng thái: <span id="loading-status" class="status" style="color: orange;">Đang tải...</span></p>
            <p style="margin-bottom: 5px;">Số điểm sét: <span id="lightning-count" style="font-weight: bold; color: #d9534f; font-size: 18px;">0</span></p>
            
            <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #ccc;">
                <span><b style="color: red;">⚡ Xuống đất:</b> <span id="cg-count" style="font-weight: bold;">0</span></span>
                <span><b style="color: #0056b3;">☁️ Trong mây:</b> <span id="ic-count" style="font-weight: bold;">0</span></span>
            </div>

            <div class="checkbox-group">
                <label><input type="checkbox" id="chk-cg" checked onchange="filterLightning(false)"> 🔴 Bật Sét Xuống đất</label>
                <label><input type="checkbox" id="chk-ic" checked onchange="filterLightning(false)"> 🟠 Bật Sét Trong mây</label>
            </div>
            
            <div class="filter-section">
                <label for="province-filter"><b>Lọc theo tỉnh:</b></label>
                <select id="province-filter" onchange="filterLightning(true)">
                    <option value="all">Toàn bộ (Tất cả)</option>
                    <option value="Lào Cai" selected>Lào Cai (Yên Bái)</option>
                    <option value="Hà Nội">Hà Nội</option>
                    <option value="Hải Phòng">Hải Phòng</option>
                    <option value="Đà Nẵng">Đà Nẵng (Quảng Nam)</option>
                    <option value="Hồ Chí Minh">TP. Hồ Chí Minh</option>
                    <option value="Cần Thơ">Cần Thơ</option>
                    <option value="Lai Châu">Lai Châu</option>
                    <option value="Điện Biên">Điện Biên</option>
                    <option value="Sơn La">Sơn La</option>
                    <option value="Hòa Bình">Hòa Bình</option>
                    <option value="Hà Giang">Hà Giang</option>
                    <option value="Tuyên Quang">Tuyên Quang</option>
                    <option value="Cao Bằng">Cao Bằng</option>
                    <option value="Bắc Kạn">Bắc Kạn</option>
                    <option value="Lạng Sơn">Lạng Sơn</option>
                    <option value="Thái Nguyên">Thái Nguyên</option>
                    <option value="Bắc Ninh">Bắc Ninh (Bắc Giang)</option>
                    <option value="Vĩnh Phúc">Phú Thọ (Vĩnh Phúc)</option>
                    <option value="Quảng Ninh">Quảng Ninh</option>
                    <option value="Hải Dương">Hải Dương</option>
                    <option value="Hưng Yên">Hưng Yên</option>
                    <option value="Thái Bình">Thái Bình</option>
                    <option value="Nam Định">Nam Định</option>
                    <option value="Hà Nam">Hà Nam</option>
                    <option value="Ninh Bình">Ninh Bình</option>
                    <option value="Thanh Hóa">Thanh Hóa</option>
                    <option value="Nghệ An">Nghệ An</option>
                    <option value="Hà Tĩnh">Hà Tĩnh</option>
                    <option value="Quảng Bình">Quảng Bình</option>
                    <option value="Thừa Thiên Huế">Thừa Thiên Huế (Quảng Trị)</option>
                    <option value="Đắk Lắk">Đắk Lắk (Phú Yên)</option>
                    <option value="Lâm Đồng">Lâm Đồng (Đắk Nông & Bình Thuận)</option>
                    <option value="Khánh Hòa">Khánh Hòa (Ninh Thuận)</option>
                    <option value="Tiền Giang">Tiền Giang (Bến Tre)</option>
                    <option value="Vĩnh Long">Vĩnh Long (Trà Vinh)</option>
                    <option value="Kiên Giang">Kiên Giang (An Giang)</option>
                    <option value="Cà Mau">Cà Mau (Bạc Liêu)</option>
                    <option value="Sóc Trăng">Sóc Trăng (Hậu Giang)</option>
                </select>

                <label for="time-filter"><b>Lọc theo thời gian:</b></label>
                <select id="time-filter" onchange="filterLightning()">
                    <option value="600" selected>10 Phút qua</option>
                    <option value="1800">30 Phút qua</option>
                    <option value="7200">2 Giờ qua</option>
                    <option value="21600">6 Giờ qua</option>
                    <option value="43200">12 Giờ qua</option>
                    <option value="86400">24 Giờ qua</option>
                    <option value="172800">2 Ngày qua</option>
                    <option value="604800">1 Tuần qua (Tất cả)</option>
                </select>
            </div>

            <div class="search-box">
                <label style="font-weight:bold; color:#0056b3;">🔍 Tìm kiếm nhanh thiết bị:</label>
                <input type="text" id="search-input" placeholder="VD: Cột 2, Lâm Sinh..." onkeyup="searchPoles()">
                <div id="search-results" style="display: none;"></div>
            </div>

        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    
    <script>
        // HÀM ẨN/HIỆN BẢNG CẢNH BÁO SÉT
        function toggleInfoPanel() {
            const panel = document.getElementById('main-info-panel');
            const icon = document.getElementById('panel-toggle-icon');
            panel.classList.toggle('collapsed');
            icon.innerHTML = panel.classList.contains('collapsed') ? '◀' : '▼';
        }

        const provinceBounds = {
            "Lào Cai": { minLat: 21.23, maxLat: 22.85, minLng: 103.50, maxLng: 105.00 },
            // ... (Giữ nguyên tọa độ các tỉnh)
            "Lai Châu": { minLat: 21.52, maxLat: 22.82, minLng: 102.31, maxLng: 103.63 },
            "Điện Biên": { minLat: 20.83, maxLat: 22.33, minLng: 102.15, maxLng: 103.59 },
            "Sơn La": { minLat: 20.65, maxLat: 22.05, minLng: 103.20, maxLng: 105.02 },
            "Hòa Bình": { minLat: 20.28, maxLat: 21.15, minLng: 104.80, maxLng: 105.85 },
            "Hà Giang": { minLat: 22.12, maxLat: 23.38, minLng: 104.33, maxLng: 105.55 },
            "Tuyên Quang": { minLat: 21.52, maxLat: 22.75, minLng: 104.80, maxLng: 105.65 },
            "Cao Bằng": { minLat: 22.25, maxLat: 23.13, minLng: 105.25, maxLng: 106.85 },
            "Bắc Kạn": { minLat: 21.80, maxLat: 22.73, minLng: 105.43, maxLng: 106.25 },
            "Thái Nguyên": { minLat: 21.33, maxLat: 22.05, minLng: 105.48, maxLng: 106.25 },
            "Lạng Sơn": { minLat: 21.32, maxLat: 22.45, minLng: 106.10, maxLng: 107.35 },
            "Quảng Ninh": { minLat: 20.73, maxLat: 21.65, minLng: 106.42, maxLng: 108.05 },
            "Hà Nội": { minLat: 20.55, maxLat: 21.38, minLng: 105.28, maxLng: 106.03 },
            "Bắc Ninh": { minLat: 21.00, maxLat: 21.63, minLng: 105.88, maxLng: 106.80 }, 
            "Vĩnh Phúc": { minLat: 20.91, maxLat: 21.72, minLng: 104.85, maxLng: 105.80 }, 
            "Hải Dương": { minLat: 20.72, maxLat: 21.23, minLng: 106.18, maxLng: 106.68 },
            "Hưng Yên": { minLat: 20.58, maxLat: 21.02, minLng: 105.88, maxLng: 106.25 },
            "Hải Phòng": { minLat: 20.58, maxLat: 21.03, minLng: 106.40, maxLng: 107.13 },
            "Thái Bình": { minLat: 20.28, maxLat: 20.73, minLng: 106.25, maxLng: 106.65 },
            "Hà Nam": { minLat: 20.38, maxLat: 20.72, minLng: 105.78, maxLng: 106.12 },
            "Nam Định": { minLat: 19.90, maxLat: 20.48, minLng: 105.92, maxLng: 106.58 },
            "Ninh Bình": { minLat: 19.83, maxLat: 20.40, minLng: 105.53, maxLng: 106.18 },
            "Thanh Hóa": { minLat: 19.30, maxLat: 20.65, minLng: 104.38, maxLng: 106.05 },
            "Nghệ An": { minLat: 18.55, maxLat: 19.90, minLng: 103.85, maxLng: 105.78 },
            "Hà Tĩnh": { minLat: 17.88, maxLat: 18.65, minLng: 105.08, maxLng: 106.25 },
            "Quảng Bình": { minLat: 17.08, maxLat: 18.10, minLng: 105.60, maxLng: 106.98 },
            "Thừa Thiên Huế": { minLat: 15.95, maxLat: 17.17, minLng: 106.45, maxLng: 108.20 }, 
            "Đà Nẵng": { minLat: 15.22, maxLat: 16.22, minLng: 107.25, maxLng: 108.73 }, 
            "Hồ Chí Minh": { minLat: 10.35, maxLat: 11.15, minLng: 106.35, maxLng: 106.98 },
            "Cần Thơ": { minLat: 9.92, maxLat: 10.32, minLng: 105.22, maxLng: 105.83 }
        };

        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
        const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google' });
        const googleSat = L.tileLayer('https://mt1.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '© Google Vệ tinh' });

        const map = L.map('map', { center: [22.0000, 104.5000], zoom: 8, layers: [osmLayer] });

        // LỚP GOM CỤM DÀNH CHO SÉT
        const lightningLayer = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                const count = cluster.getChildCount();
                let bgColor = count >= 50 ? 'rgba(253, 126, 20, 0.85)' : 'rgba(255, 193, 7, 0.85)'; 
                let borderColor = count >= 50 ? '#FD7E14' : '#FFC107';
                let textColor = count >= 50 ? '#fff' : '#000';
                let size = count >= 50 ? 45 : 35;

                return L.divIcon({
                    html: `<div style="background-color: ${bgColor}; border: 2px solid ${borderColor}; color: ${textColor}; width: ${size}px; height: ${size}px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; box-shadow: 0 3px 8px rgba(0,0,0,0.3);">${count}</div>`,
                    className: 'custom-cluster-icon', iconSize: L.point(size, size)
                });
            },
            animate: false, chunkedLoading: true 
        }).addTo(map);

        const dienLucList = {
            " ĐL Văn Bàn": "vanban.json", " ĐL Lào Cai": "laocai.json", " ĐL SaPa": "sapa.json",
            " ĐL Bát Xát": "batxat.json", " ĐL Bắc Hà": "bacha.json", " ĐL Bảo Thắng": "baothang.json",
            " ĐL Bảo Yên": "baoyen.json", " ĐL Mường Khương": "muongkhuong.json", " ĐL Yên Bái": "yenbai.json",
            " ĐL Trấn Yên": "tranyen.json", " ĐL Văn Yên": "vanyen.json", " ĐL Lục Yên": "lucyen.json",
            " ĐL Nghĩa Lộ": "nghialo.json", " Cao Thế LC": "caothelc.json", " Cao Thế YB": "caotheyb.json"
        };

        const gridLayers = {};
        const overlayMaps = { "⚡ Cảnh báo Sét đánh": lightningLayer };

        for (let key in dienLucList) {
            gridLayers[key] = L.markerClusterGroup({
                iconCreateFunction: function(cluster) {
                    const count = cluster.getChildCount();
                    let size = count >= 100 ? 50 : 40;
                    return L.divIcon({
                        html: `<div style="background-color: rgba(0, 123, 255, 0.85); border: 2px solid #0056b3; color: white; width: ${size}px; height: ${size}px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; box-shadow: 0 3px 8px rgba(0,0,0,0.4); line-height: 1.1;">
                                  <span style="font-size: 14px;">🔌</span><span>${count}</span></div>`,
                        className: 'custom-cluster-icon', iconSize: L.point(size, size)
                    });
                },
                animate: false, chunkedLoading: true, maxClusterRadius: 60, disableClusteringAtZoom: 15
            });
            overlayMaps[key] = gridLayers[key];
        }

        const baseMaps = { "🗺️ Bản đồ Tiêu chuẩn": osmLayer, "🚗 Bản đồ Giao thông": googleStreets, "🛰️ Bản đồ Vệ tinh": googleSat };

        // ĐỔI SANG COLLAPSED: FALSE ĐỂ CHÈN NÚT CUSTOM SAU ĐÓ
        const layerControl = L.control.layers(baseMaps, overlayMaps, {collapsed: false, position: 'bottomleft'}).addTo(map);

        // HÀM TẠO NÚT THU GỌN LAYER BẢN ĐỒ
        const layerContainer = layerControl.getContainer();
        const collapseLayerBtn = document.createElement('div');
        collapseLayerBtn.className = 'layer-collapse-btn';
        collapseLayerBtn.innerHTML = '▼ Thu gọn (Các lớp Bản đồ)';
        layerContainer.insertBefore(collapseLayerBtn, layerContainer.firstChild);
        
        collapseLayerBtn.onclick = function(e) {
            e.stopPropagation();
            layerContainer.classList.toggle('custom-collapsed');
            if (layerContainer.classList.contains('custom-collapsed')) {
                collapseLayerBtn.innerHTML = '▲ Bật / Tắt Lớp Bản Đồ';
            } else {
                collapseLayerBtn.innerHTML = '▼ Thu gọn (Các lớp Bản đồ)';
            }
        };

        map.on('overlayadd overlayremove', function() { filterLightning(); searchPoles(); });

        const lightningIconRed = L.divIcon({
            html: '<svg width="24" height="24" viewBox="0 0 24 24"><path fill="#ff1a1a" stroke="#ffffff" stroke-width="1" d="M12,2L2,14h8v8l12-12h-8L12,2z"></path></svg>',
            className: 'lightning-icon-div', iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12]
        });

        const lightningIconCloud = L.divIcon({
            html: '<svg width="28" height="28" viewBox="0 0 24 24"><path fill="#546E7A" stroke="#ffffff" stroke-width="0.5" d="M17.5,19A4.5,4.5 0 0,0 22,14.5C22,12.18 20.24,10.28 18,10.05C17.44,6.64 14.48,4 11,4C7.71,4 4.86,6.19 3.65,9.17C1.59,9.61 0,11.45 0,13.66C0,16.05 1.95,18 4.34,18H5V16H4.34C3.05,16 2,14.95 2,13.66C2,12.44 2.92,11.41 4.12,11.27L5.05,11.16L5.35,10.29C6.26,7.63 8.78,5.8 11.66,5.8C14.86,5.8 17.52,8.35 17.65,11.5L17.7,12.2L18.4,12.23C20.17,12.33 21.6,13.82 21.6,15.6C21.6,17.42 20.12,18.9 18.3,18.9H17V20.9H17.5Z"></path><path fill="#FFC107" stroke="#ffffff" stroke-width="1" d="M13,22l-3-8h2.5L11.5,5h3.5l3,8h-2.5L17,22L13,22z"></path></svg>',
            className: 'lightning-icon-div', iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14]
        });

        function detectPoleName(properties) {
            if (!properties) return "Không rõ tên";
            let tenDoiTuong = ""; let soHieu = "";
            const tenKeys = ['tenDoiTuon', 'TenDoiTuong', 'tenDoiTuong', 'TEN_DOI_TUONG'];
            for (let key of tenKeys) { if (properties[key]) { tenDoiTuong = properties[key]; break; } }
            const soHieuKeys = ['soHieu', 'SoHieu', 'SO_HIEU'];
            for (let key of soHieuKeys) { if (properties[key]) { soHieu = properties[key]; break; } }
            if (tenDoiTuong && soHieu) return `${tenDoiTuong} (${soHieu})`;
            else if (tenDoiTuong) return tenDoiTuong; 
            else if (soHieu) return `Số hiệu: ${soHieu}`; 
            return "Cột chưa đặt tên";
        }

        let poleFeaturesByLayer = {}; 
        let currentExportData = [];
        let lightningArray = []; 

        async function loadGeoData() {
            for (let key in dienLucList) {
                poleFeaturesByLayer[key] = []; 
                try {
                    const response = await fetch(`./${dienLucList[key]}?t=${new Date().getTime()}`);
                    if (response.ok) {
                        const data = await response.json();
                        let poles = data.features.filter(f => f.geometry && (f.geometry.type === "Point" || f.geometry.type === "MultiPoint"));
                        poleFeaturesByLayer[key].push(...poles);

                        L.geoJSON(data, {
                            style: function (feature) {
                                if (feature.geometry.type === "LineString" || feature.geometry.type === "MultiLineString") return { color: "#0056b3", weight: 3, opacity: 0.8 }; 
                                return {};
                            },
                            pointToLayer: function (feature, latlng) {
                                return L.circleMarker(latlng, { radius: 5, fillColor: "#007bff", color: "#ffffff", weight: 1, fillOpacity: 0.9 });
                            },
                            onEachFeature: function (feature, layer) {
                                if (feature.properties) {
                                    let popupContent = "<div class='popup-custom'><b>Thông Tin Thiết Bị</b><hr style='margin:5px 0'>";
                                    for (const propKey in feature.properties) {
                                        if(feature.properties[propKey] !== null) popupContent += `<b>${propKey}:</b> ${feature.properties[propKey]}<br>`;
                                    }
                                    layer.bindPopup(popupContent + "</div>");
                                }
                            }
                        }).addTo(gridLayers[key]);
                    }
                } catch (error) {}
            }
        }

        // HÀM TÌM KIẾM CỘT ĐIỆN VÀ ZOOM
        function searchPoles() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = '';

            if (query.length < 1) {
                resultsDiv.style.display = 'none';
                return;
            }

            // Gộp tất cả các cột từ các lớp ĐANG ĐƯỢC BẬT TRÊN BẢN ĐỒ
            let activePoles = [];
            for (let key in gridLayers) {
                if (map.hasLayer(gridLayers[key]) && poleFeaturesByLayer[key]) {
                    activePoles = activePoles.concat(poleFeaturesByLayer[key]);
                }
            }

            if (activePoles.length === 0) {
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = '<div style="padding:6px; color:#d9534f; font-size:11px; font-weight:bold; background:white; border-radius:3px;">⚠ Vui lòng bật Lớp Lưới điện bên trái trước!</div>';
                return;
            }

            // Lọc kết quả (giới hạn 15 kết quả để tránh lag)
            let matches = activePoles.filter(p => detectPoleName(p.properties).toLowerCase().includes(query)).slice(0, 15);

            if (matches.length === 0) {
                resultsDiv.style.display = 'block';
                resultsDiv.innerHTML = '<div style="padding:6px; color:#666; font-size:11px; background:white; border-radius:3px;">Không tìm thấy thiết bị nào khớp.</div>';
                return;
            }

            resultsDiv.style.display = 'block';
            matches.forEach(match => {
                let name = detectPoleName(match.properties);
                let lat, lng;
                if (match.geometry.type === "Point") {
                    lng = match.geometry.coordinates[0];
                    lat = match.geometry.coordinates[1];
                } else if (match.geometry.type === "MultiPoint") {
                    lng = match.geometry.coordinates[0][0];
                    lat = match.geometry.coordinates[0][1];
                }

                let itemDiv = document.createElement('div');
                itemDiv.className = 'search-item';
                itemDiv.innerHTML = `<span title="${name}">${name}</span> <button onclick="zoomToSearchedPole(${lat}, ${lng}, '${name}')">Đến</button>`;
                resultsDiv.appendChild(itemDiv);
            });
        }

        function zoomToSearchedPole(lat, lng, name) {
            map.flyTo([lat, lng], 18, {animate: true, duration: 1.5});
            setTimeout(() => {
                L.popup().setLatLng([lat, lng]).setContent(`<b style="color:#0056b3; font-size:14px;">🎯 Vị trí tìm kiếm:</b><br>${name}`).openOn(map);
            }, 1500);
        }

        async function fetchLightningData() {
            const statusLabel = document.getElementById('loading-status');
            try {
                const response = await fetch('https://datasetweb-default-rtdb.asia-southeast1.firebasedatabase.app/.json');
                if (!response.ok) throw new Error("Lỗi kết nối Firebase");
                
                const lightningDatabase = await response.json();
                if (lightningDatabase) {
                    lightningArray = Object.values(lightningDatabase).sort((a, b) => b.timestamp - a.timestamp);
                    filterLightning(true);
                }
                statusLabel.innerText = "Hoạt động tốt (Firebase)";
                statusLabel.style.color = "green";
            } catch (error) {
                statusLabel.innerText = "Mất kết nối máy chủ sét...";
                statusLabel.style.color = "red";
            }
        }

        function filterLightning(autoZoom = false) {
            lightningLayer.clearLayers();
            
            const filterSeconds = parseInt(document.getElementById('time-filter').value);
            const selectedProvince = document.getElementById('province-filter').value;
            const currentSeconds = Date.now() / 1000;
            const threshold = currentSeconds - filterSeconds;

            // Lấy trạng thái của 2 Checkbox
            const showCG = document.getElementById('chk-cg').checked;
            const showIC = document.getElementById('chk-ic').checked;

            if (autoZoom) {
                if (selectedProvince === "all") map.setView([16.5, 105.0], 6); 
                else if (provinceBounds[selectedProvince]) {
                    const b = provinceBounds[selectedProvince];
                    map.fitBounds([[b.minLat, b.minLng], [b.maxLat, b.maxLng]]);
                }
            }

            let count = 0, cgCount = 0, icCount = 0; 
            
            for (let i = 0; i < lightningArray.length; i++) {
                const record = lightningArray[i];
                if (record.timestamp < threshold) break; 

                // Tích hợp logic lọc Checkbox
                let isCloud = record.loaiset === 1 || record.loaiset === "Trong mây";
                if (isCloud && !showIC) continue; // Nếu là sét mây mà tắt checkbox -> bỏ qua
                if (!isCloud && !showCG) continue; // Nếu là sét đất mà tắt checkbox -> bỏ qua

                let parsedStrikes = [];
                if (record.is_new_format) {
                    let typeText = record.loaiset === 0 ? "Xuống đất" : "Trong mây";
                    let giatriText = (record.giatri === 0 || record.giatri === 0.0) ? "Không có DL" : `${record.giatri} kA`;
                    parsedStrikes.push({ lat: record.lat, lng: record.lng, giatri: giatriText, loaiset: typeText });
                }

                for (let strike of parsedStrikes) {
                    if (isNaN(strike.lat) || isNaN(strike.lng)) continue;
                    if (selectedProvince !== "all" && provinceBounds[selectedProvince]) {
                        const b = provinceBounds[selectedProvince];
                        if (strike.lat < b.minLat || strike.lat > b.maxLat || strike.lng < b.minLng || strike.lng > b.maxLng) continue;
                    }

                    const dateObj = new Date(record.timestamp * 1000);
                    const timeString = dateObj.toLocaleTimeString('vi-VN') + " - " + dateObj.toLocaleDateString('vi-VN');

                    let currentIcon = lightningIconRed; 
                    if (strike.loaiset === "Trong mây") { currentIcon = lightningIconCloud; icCount++; } 
                    else { cgCount++; }

                    let colorCode = strike.loaiset.includes("đất") ? "red" : "#ff8c00";
                    const popupHTML = `
                        <div style="font-family: Arial; font-size: 13px; width: 230px; line-height: 1.5;">
                            <b style="color:${colorCode}; font-size:14px;">⚡ THÔNG TIN SÉT</b><hr style="margin:5px 0;">
                            <b>Tọa độ:</b> ${strike.lat.toFixed(4)}, ${strike.lng.toFixed(4)}<br>
                            <b>Thời gian:</b> <span style="color:blue; font-weight:bold;">${timeString}</span><br>
                            <b>Cường độ:</b> <span style="color:#d32f2f; font-weight:bold;">${strike.giatri}</span><br>
                            <b>Loại sét:</b> ${strike.loaiset}<br>
                        </div>
                    `;

                    const marker = L.marker([strike.lat, strike.lng], { icon: currentIcon }).bindPopup(popupHTML);
                    lightningLayer.addLayer(marker);
                    count++;
                }
            }
            
            document.getElementById('lightning-count').innerText = count;
            document.getElementById('cg-count').innerText = cgCount;
            document.getElementById('ic-count').innerText = icCount;
        }

        loadGeoData(); 
        fetchLightningData(); 
        setInterval(fetchLightningData, 180000); 
    </script>
</body>
