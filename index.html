<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Chuyển Máy Chủ</title>
    
    <!-- LỆNH TỰ ĐỘNG CHUYỂN HƯỚNG SAU 5 GIÂY -->
    <meta http-equiv="refresh" content="5;url=http://canhbaoset.ddns.net:8080" />
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 90%;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h2 {
            color: #d32f2f;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-redirect {
            display: inline-block;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        }
        .btn-redirect:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .countdown {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
            font-style: italic;
        }
        .countdown span {
            font-weight: bold;
            color: #d32f2f;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚀</div>
        <h2>Website Đã Chuyển Địa Chỉ!</h2>
        <p>Hệ thống <b>Bản Đồ Cảnh Báo Sét EVN</b> đã được nâng cấp và chuyển về máy chủ nội bộ để hoạt động ổn định, tải dữ liệu nhanh hơn.</p>
        
        <!-- NÚT BẤM DẪN SANG LINK MỚI CÓ CỔNG 8080 -->
        <a href="http://canhbaoset.ddns.net:8080" class="btn-redirect">Đến Trang Mới Ngay</a>
        
        <div class="countdown">
            Hệ thống sẽ tự động chuyển trang sau <span id="time">5</span> giây...
        </div>
    </div>

    <script>
        // Code tạo hiệu ứng đếm ngược số 5, 4, 3, 2, 1
        let timeLeft = 5;
        const timeElement = document.getElementById('time');
        const timer = setInterval(() => {
            timeLeft--;
            timeElement.textContent = timeLeft;
            if (timeLeft <= 0) clearInterval(timer);
        }, 1000);
    </script>

</body>
</html>
