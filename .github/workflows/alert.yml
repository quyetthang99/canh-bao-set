name: Bot Cảnh Báo Telegram

on:
  schedule:
    - cron: '*/10 * * * *' # Chạy tự động mỗi 10 phút
  workflow_dispatch: # Nút bấm chạy bằng tay (nếu cần)

jobs:
  run-alerter:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Cài đặt Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Chạy Bot Quét Sự Cố
      run: python alert.py
