name: He Thong Canh Bao Set

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bots:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Cài đặt Python & Thư viện
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: pip install requests

    - name: Chạy Bot 1 (Cào dữ liệu & Bắn lên Firebase)
      run: python crawl.py

    # TUYỆT ĐỐI KHÔNG CẦN BƯỚC GIT ADD HAY GIT COMMIT NỮA BÁC NHÉ
